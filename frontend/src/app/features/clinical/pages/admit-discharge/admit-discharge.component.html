<div class="page-header-bar">
  <h1>Admit / Discharge</h1>
</div>

<div class="tabs">
  <button [class.active]="mode === 'admit'" (click)="mode = 'admit'">Admit Patient</button>
  <button [class.active]="mode === 'discharge'" (click)="mode = 'discharge'">Discharge Patient</button>
</div>

<div class="card">
  @if (error) { <div class="alert alert-error">{{ error }}</div> }

  @if (mode === 'admit') {
    <form [formGroup]="admitForm" (ngSubmit)="onAdmit()">
      <div class="form-group">
        <label>Patient ID *</label>
        <input formControlName="patient_id" />
      </div>
      <div class="form-group">
        <label>Bed ID</label>
        <input formControlName="bed_id" placeholder="Optional" />
      </div>
      <div class="form-group">
        <label>Admission Number *</label>
        <input formControlName="admission_number" placeholder="ADM-2024-0001" />
      </div>
      <div class="form-group">
        <label>Type *</label>
        <select formControlName="admission_type">
          <option value="ELECTIVE">Elective</option>
          <option value="EMERGENCY">Emergency</option>
          <option value="REFERRAL">Referral</option>
        </select>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          @if (loading) { Admitting... } @else { Admit Patient }
        </button>
      </div>
    </form>
  } @else {
    <form [formGroup]="dischargeForm" (ngSubmit)="onDischarge()">
      <div class="form-group">
        <label>Admission ID *</label>
        <input formControlName="admission_id" />
      </div>
      <div class="form-group">
        <label>Discharge Type</label>
        <select formControlName="discharge_type">
          <option value="HOME">Home</option>
          <option value="TRANSFER">Transfer</option>
          <option value="DEATH">Death</option>
          <option value="ABSCONDED">Absconded</option>
        </select>
      </div>
      <div class="form-group full-width">
        <label>Discharge Summary</label>
        <textarea formControlName="discharge_summary" rows="4"></textarea>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          @if (loading) { Discharging... } @else { Discharge Patient }
        </button>
      </div>
    </form>
  }
</div>
