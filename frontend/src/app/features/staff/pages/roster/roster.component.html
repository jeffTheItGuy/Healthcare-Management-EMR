<div class="page-header-bar">
  <h1>Staff Roster</h1>
  <button class="btn btn-primary" (click)="showForm = !showForm">{{ showForm ? 'Cancel' : '+ Add Shift' }}</button>
</div>

@if (showForm) {
  <div class="card" style="max-width: 600px; margin-bottom: 20px;">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="form-group"><label>Date *</label><input type="date" formControlName="roster_date" /></div>
        <div class="form-group">
          <label>Shift *</label>
          <select formControlName="shift_type">
            <option value="MORNING">Morning</option>
            <option value="AFTERNOON">Afternoon</option>
            <option value="NIGHT">Night</option>
          </select>
        </div>
        <div class="form-group"><label>Start</label><input type="time" formControlName="start_time" /></div>
        <div class="form-group"><label>End</label><input type="time" formControlName="end_time" /></div>
        <div class="form-group"><label>Ward ID</label><input formControlName="ward_id" /></div>
        <div class="form-group full-width"><label>Notes</label><textarea formControlName="notes" rows="2"></textarea></div>
      </div>
      <div class="actions"><button type="submit" class="btn btn-primary">Save Shift</button></div>
    </form>
  </div>
}

<div class="card">
  <table class="data-table">
    <thead><tr><th>Date</th><th>Shift</th><th>Time</th><th>Notes</th></tr></thead>
    <tbody>
      @for (r of roster; track r.roster_id) {
        <tr>
          <td>{{ r.roster_date | dateFormat }}</td>
          <td>{{ r.shift_type }}</td>
          <td>{{ r.start_time || '-' }} - {{ r.end_time || '-' }}</td>
          <td>{{ r.notes || '-' }}</td>
        </tr>
      } @empty {
        <tr><td colspan="4" class="empty">No roster entries</td></tr>
      }
    </tbody>
  </table>
</div>
