version: "3.9"

services:
  db:
    image: ankane/pgvector:latest
    container_name: zim-emr-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c work_mem=32MB
      -c max_connections=200

  backend:
    build: ./backend
    container_name: zim-emr-api
    restart: always
    env_file: .env
    environment:
      - HF_HOME=/root/.cache/huggingface   # <-- pins cache location
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/backups
      - huggingface_cache:/root/.cache/huggingface   # <-- persists model downloads
    expose:
      - "8000"
    depends_on:
      - db
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zim-emr-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  huggingface_cache:  