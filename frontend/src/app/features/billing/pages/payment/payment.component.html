<div class="page-header-bar">
  <h1>Record Payment</h1>
</div>

<div class="card" style="max-width: 600px;">
  @if (error) { <div class="alert alert-error">{{ error }}</div> }
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group"><label>Invoice ID *</label><input formControlName="invoice_id" /></div>
    <div class="form-group"><label>Patient ID *</label><input formControlName="patient_id" /></div>
    <div class="form-group">
      <label>Method *</label>
      <select formControlName="payment_method">
        <option value="CASH">Cash</option>
        <option value="ECOCASH">EcoCash</option>
        <option value="ZIPIT">ZIPIT</option>
        <option value="BANK_TRANSFER">Bank Transfer</option>
        <option value="CARD">Card</option>
        <option value="USD_CASH">USD Cash</option>
        <option value="ZiG_CASH">ZiG Cash</option>
        <option value="MEDICAL_AID">Medical Aid</option>
      </select>
    </div>
    <div class="form-group"><label>Amount *</label><input formControlName="amount" type="number" /></div>
    <div class="form-group"><label>Currency</label><select formControlName="currency_code"><option value="USD">USD</option><option value="ZiG">ZiG</option></select></div>
    <div class="form-group"><label>Reference #</label><input formControlName="reference_number" /></div>
    <div class="actions">
      <button type="button" class="btn btn-secondary" routerLink="/billing/invoices">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        @if (loading) { Processing... } @else { Record Payment }
      </button>
    </div>
  </form>
</div>
