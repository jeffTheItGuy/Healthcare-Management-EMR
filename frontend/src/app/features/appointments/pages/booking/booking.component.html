<div class="page-header-bar">
  <h1>Book Appointment</h1>
</div>

<div class="card" style="max-width: 600px;">
  @if (error) {
    <div class="alert alert-error">{{ error }}</div>
  }
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Patient ID *</label>
      <input formControlName="patient_id" />
    </div>
    <div class="form-group">
      <label>Doctor ID</label>
      <input formControlName="doctor_id" />
    </div>
    <div class="form-group">
      <label>Department ID</label>
      <input formControlName="department_id" />
    </div>
    <div class="form-group">
      <label>Appointment Number *</label>
      <input formControlName="appointment_number" placeholder="APT-20240728-0001" />
    </div>
    <div class="form-group">
      <label>Scheduled Date *</label>
      <input type="date" formControlName="scheduled_date" />
    </div>
    <div class="form-group">
      <label>Scheduled Time</label>
      <input type="time" formControlName="scheduled_time" />
    </div>
    <div class="form-group">
      <label>Duration (minutes)</label>
      <input type="number" formControlName="estimated_duration_minutes" />
    </div>
    <div class="form-group">
      <label>Type *</label>
      <select formControlName="appointment_type">
        <option value="OPD_CONSULTATION">OPD Consultation</option>
        <option value="FOLLOW_UP">Follow Up</option>
        <option value="LAB_REVIEW">Lab Review</option>
        <option value="PROCEDURE">Procedure</option>
        <option value="TELEMEDICINE">Telemedicine</option>
      </select>
    </div>
    <div class="form-group">
      <label>Chief Complaint</label>
      <textarea formControlName="chief_complaint" rows="2"></textarea>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea formControlName="notes" rows="3"></textarea>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-secondary" routerLink="/appointments">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        @if (loading) { Booking... } @else { Book Appointment }
      </button>
    </div>
  </form>
</div>
