version: "3.9"

# ============================================================
# ZIMBABWE HOSPITAL EMR — DEVELOPMENT OVERRIDE
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml exec backend python -c \
#     "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL 16 + pgvector
  # ----------------------------------------------------------
  db:
    image: ankane/pgvector:latest
    container_name: zim-emr-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zemr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-zim_emr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zemr_admin} -d ${POSTGRES_DB:-zim_emr}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c work_mem=16MB
      -c max_connections=100
      -c log_statement=all
      -c log_destination=stderr

  # ----------------------------------------------------------
  # pgAdmin (optional dev tool)
  # Access: http://localhost:5050
  # Login: admin@zimemr.co.zw / admin
  # ----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zim-emr-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@zimemr.co.zw}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------
  # Backend API (FastAPI + Uvicorn with hot-reload)
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: zim-emr-api-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zim_emr}
      POSTGRES_USER: ${POSTGRES_USER:-zemr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-zemr_admin}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-zim_emr}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./backend:/app:cached
      - ./uploads:/app/uploads
      - ./backups:/backups
      - backend_venv:/app/.venv
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app

  # ----------------------------------------------------------
  # Frontend (Angular dev server)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: zim-emr-web-dev
    restart: unless-stopped
    environment:
      API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    depends_on:
      - backend

volumes:
  postgres_data:
  pgadmin_data:
  backend_venv:
  huggingface_cache:

networks:
  default:
    name: zim-emr-network
    driver: bridge